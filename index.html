<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b10">
  <title>Platform MD Career Film — Draft v3</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #f7f7f8;
      background: radial-gradient(circle at top, #202737, #090b10 58%);
      font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif;
    }
    main { width: min(100%, 430px); text-align: center; }
    .badge {
      display: inline-block;
      margin-bottom: 12px;
      padding: 6px 10px;
      border: 1px solid #606979;
      border-radius: 999px;
      color: #d5dae3;
      font-size: 12px;
      letter-spacing: .08em;
    }
    h1 { margin: 0 0 16px; font-size: 20px; }
    video {
      width: 100%;
      max-height: 78vh;
      border-radius: 18px;
      background: #000;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }
    p { margin: 14px 0 0; color: #aeb5c0; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <span class="badge">DRAFT v3 · SYNCED</span>
    <h1>Platform MD Career Film</h1>
    <video controls playsinline preload="metadata" poster="">
      <source src="platform-md-career-film-v3.mp4" type="video/mp4">
      이 브라우저에서는 영상을 재생할 수 없습니다.
    </video>
    <p>남성 나레이션 · 회사별 장면 싱크 · 새 배경음악</p>
  </main>
</body>
</html>
